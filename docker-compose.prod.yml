services:
  postgres:
    image: postgres:16.8-alpine3.21
    container_name: love-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-love}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # 必须通过环境变量设置
      POSTGRES_DB: ${POSTGRES_DB:-love_node}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - love-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-love} -d ${POSTGRES_DB:-love_node}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.2-alpine3.21
    container_name: love-redis-prod
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      - love-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  netease:
    # NeteaseCloudMusicApiEnhanced — the MAINTAINED fork of the archived
    # (2024-04) Binaryify NeteaseCloudMusicApi. Self-built from ./netease-api so
    # (a) no third-party prebuilt image sits in the prod path and (b) we get the
    # startup guest-token refresh that fixes NetEase's "需要验证"/301 login-loss
    # (see netease-api/server.js). Used exclusively by cottage-listen-together.
    # Intentionally NOT exposed to the host: only the `backend` service can
    # reach it via the internal love-network at http://netease:3000.
    build:
      context: ./netease-api
      dockerfile: Dockerfile
    image: love-netease-enhanced:local
    container_name: love-netease-prod
    restart: always
    networks:
      - love-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # ~10s to register the anonymous token before it listens — don't flap.
      start_period: 30s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: love-backend-prod
    restart: always
    environment:
      APP_NAME: ${APP_NAME:-Love Journal}
      APP_ENV: production
      # Pass database components separately so the backend can construct a
      # correctly escaped SQLAlchemy URL even when the password contains
      # reserved characters such as @, :, /, # or %.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-love}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-love_node}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}  # 必须设置强密钥
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      BOOTSTRAP_SETUP_TOKEN: ${BOOTSTRAP_SETUP_TOKEN:-}
      # 与 JWT_SECRET_KEY 分离的独立密钥，加密 Redis 中的网易云 Cookie/登录 IP
      COOKIE_VAULT_KEY: ${COOKIE_VAULT_KEY:-}
      # Production nginx is TLS-only; cookies must match that transport policy.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-600/minute}
      CORS_ORIGINS: ${CORS_ORIGINS}  # 例如：https://yourdomain.com
      NETEASE_API_BASE_URL: http://netease:3000
      NOTIFICATION_SCHEDULER_INTERVAL_SECONDS: ${NOTIFICATION_SCHEDULER_INTERVAL_SECONDS:-60}
      NOTIFICATION_SCHEDULER_DAYS_AHEAD: ${NOTIFICATION_SCHEDULER_DAYS_AHEAD:-7}
      NOTIFICATION_PUSH_EMAIL_ENABLED: ${NOTIFICATION_PUSH_EMAIL_ENABLED:-false}
      NOTIFICATION_SMTP_HOST: ${NOTIFICATION_SMTP_HOST:-}
      NOTIFICATION_SMTP_PORT: ${NOTIFICATION_SMTP_PORT:-587}
      NOTIFICATION_SMTP_USER: ${NOTIFICATION_SMTP_USER:-}
      NOTIFICATION_SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD:-}
      NOTIFICATION_SMTP_FROM: ${NOTIFICATION_SMTP_FROM:-}
      NOTIFICATION_SMTP_USE_TLS: ${NOTIFICATION_SMTP_USE_TLS:-true}
      NOTIFICATION_PUSH_EMAIL_PARTNER_A: ${NOTIFICATION_PUSH_EMAIL_PARTNER_A:-}
      NOTIFICATION_PUSH_EMAIL_PARTNER_B: ${NOTIFICATION_PUSH_EMAIL_PARTNER_B:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:noreply@example.com}
      FCM_PUSH_ENABLED: ${FCM_PUSH_ENABLED:-false}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    volumes:
      - ./server/uploads:/app/uploads  # 持久化上传文件
      - ./server/backups:/app/backups  # 持久化备份文件
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      netease:
        # service_started rather than service_healthy: NetEase upstream
        # availability is a soft dependency and must not block backend boot
        # (R1.6).
        condition: service_started
    networks:
      - love-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: love-web-prod
    restart: always
    networks:
      - love-network
    depends_on:
      - backend

  nginx:
    image: nginx:1.27.4-alpine3.21
    container_name: love-nginx-prod
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL 证书目录
      - ./nginx/ssl-challenge:/var/www/certbot:ro  # ACME 挑战目录（certbot webroot 申请/续期）
      - ./server/uploads:/var/www/uploads:ro  # 静态文件服务
    depends_on:
      - web
      - backend
    networks:
      - love-network
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "https://127.0.0.1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  love-network:
    driver: bridge
