name: CI

on:
  push:
  pull_request:
    branches: [main, master]

# 最小权限：CI 只需要读取代码。
permissions:
  contents: read

# 同一分支的连续推送只保留最新一次运行，取消已在跑的旧运行。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-test:
    name: Server (Python tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      # actions/checkout v4.3.0（SHA pin，防上游 tag 劫持）
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///./test_ci.db"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "ci-test-secret-not-for-production-at-least-32-chars"
        run: pytest -q

  web-test:
    name: Web (test, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      # actions/checkout v4.3.0
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: |
          npm test
          npm run lint
          npm run build
          npm audit --omit=dev

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v4.3.0
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tooling
        run: pip install -r server/requirements-dev.txt

      - name: Lint Python (flake8)
        run: flake8 server/app

  production-config:
    name: Production Compose configuration
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v4.3.0
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

  production-images:
    name: Production image builds
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v4.3.0
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Build backend image
        run: docker build --file server/Dockerfile -t love-journal-backend:ci server

      - name: Build web image
        run: docker build --file web/Dockerfile.prod --build-arg VITE_API_BASE_URL=/api -t love-journal-web:ci web

      - name: Build NetEase helper image
        run: docker build --file netease-api/Dockerfile -t love-journal-netease:ci netease-api

      # Trivy 扫描：HIGH/CRITICAL 且已有修复版本的漏洞会让 CI 失败，
      # 防止带已知漏洞的镜像进入生产。ignore-unfixed 避免上游暂无补丁
      # 的披露长期阻塞构建。
      - name: Scan backend image (trivy)
        # aquasecurity/trivy-action v0.36.0（annotated tag 的剥离 commit）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: love-journal-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: love-journal-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan NetEase helper image (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: love-journal-netease:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # SBOM（CycloneDX）：为每个生产镜像生成软件物料清单并作为 workflow
      # artifact 留存，便于供应链审计与漏洞影响面排查。
      - name: Generate backend SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: love-journal-backend:ci
          format: cyclonedx
          output: backend-sbom.cdx.json
          scanners: ""

      - name: Generate web SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: love-journal-web:ci
          format: cyclonedx
          output: web-sbom.cdx.json
          scanners: ""

      - name: Generate NetEase helper SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: love-journal-netease:ci
          format: cyclonedx
          output: netease-sbom.cdx.json
          scanners: ""

      - name: Upload SBOM artifacts
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: "*-sbom.cdx.json"
          retention-days: 30
