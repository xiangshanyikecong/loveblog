name: CI

on:
  push:
  pull_request:
    branches: [main, master]

jobs:
  server-test:
    name: Server (Python tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///./test_ci.db"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "ci-test-secret-not-for-production-at-least-32-chars"
        run: pytest -q

  web-test:
    name: Web (test, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: |
          npm test
          npm run lint
          npm run build
          npm audit --omit=dev

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tooling
        run: pip install -r server/requirements-dev.txt

      - name: Lint Python (flake8)
        run: flake8 server/app

  production-config:
    name: Production Compose configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

  production-images:
    name: Production image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file server/Dockerfile -t love-journal-backend:ci server

      - name: Build web image
        run: docker build --file web/Dockerfile.prod --build-arg VITE_API_BASE_URL=/api -t love-journal-web:ci web

      - name: Build NetEase helper image
        run: docker build --file netease-api/Dockerfile -t love-journal-netease:ci netease-api

      # Trivy 扫描：HIGH/CRITICAL 且已有修复版本的漏洞会让 CI 失败，
      # 防止带已知漏洞的镜像进入生产。ignore-unfixed 避免上游暂无补丁
      # 的披露长期阻塞构建。
      - name: Scan backend image (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: love-journal-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: love-journal-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan NetEase helper image (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: love-journal-netease:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # SBOM（CycloneDX）：为每个生产镜像生成软件物料清单并作为 workflow
      # artifact 留存，便于供应链审计与漏洞影响面排查。
      - name: Generate backend SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: love-journal-backend:ci
          format: cyclonedx
          output: backend-sbom.cdx.json
          scanners: ""

      - name: Generate web SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: love-journal-web:ci
          format: cyclonedx
          output: web-sbom.cdx.json
          scanners: ""

      - name: Generate NetEase helper SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: love-journal-netease:ci
          format: cyclonedx
          output: netease-sbom.cdx.json
          scanners: ""

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "*-sbom.cdx.json"
          retention-days: 30
