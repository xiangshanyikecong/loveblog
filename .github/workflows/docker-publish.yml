# 构建生产镜像并推送到 GitHub Container Registry (ghcr.io)。
#
# 触发方式：
#   1. 推送 v* 版本标签（如 v1.0.2）→ 镜像打上 1.0.2、1.0、latest 标签
#   2. 手动触发（workflow_dispatch）→ 镜像打上 sha-xxxxxxx 标签（用于测试）
#
# 镜像为公开包，deploy.sh 默认直接拉取（无需 docker login），避免在用户
# 服务器上构建；服务器本地构建仍可通过 `./deploy.sh --build` 使用。
#
# 注意：仓库当前为私有，首次推送后镜像包默认为私有。请在 GitHub 仓库页
# 右侧 Packages 中将三个 loveblog-* 包的可见性手动改为 Public（仅需一次），
# 否则用户服务器拉取镜像需要登录 ghcr.io。镜像不含任何密钥（所有密码
# 均在运行时通过 .env.production 注入），公开是安全的。

name: Docker Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # 与 docker-compose.prod.yml / deploy.sh 中保持一致（GHCR 要求全小写）
  IMAGE_PREFIX: ghcr.io/xiangshanyikecong

jobs:
  publish:
    name: Build & push ${{ matrix.name }} (amd64 + arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./server
            file: ./server/Dockerfile
          - name: web
            context: ./web
            file: ./web/Dockerfile.prod
            build-args: VITE_API_BASE_URL=/api
          - name: netease
            context: ./netease-api
            file: ./netease-api/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 模拟)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/loveblog-${{ matrix.name }}
          tags: |
            # v1.2.3 → 1.2.3 与 1.2（次版本滚动标签，便于用户固定主版本）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 正式标签发布时同时更新 latest
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # 手动触发时用提交短 SHA 标记，避免污染 latest
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
