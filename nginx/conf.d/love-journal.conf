# Love Journal Nginx 配置
# 适用于生产环境

# 上游服务定义
upstream backend_api {
    server backend:8000;
    keepalive 32;
}

upstream frontend_web {
    server web:80;
    keepalive 32;
}

# Production is TLS-only. The backend health check does not traverse this
# redirect, so port 80 has no authenticated exception.
server {
    listen 80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
}

# 主服务器配置
server {
    listen 443 ssl http2 default_server;
    server_name _;
    
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # 日志配置
    access_log /var/log/nginx/love-journal-access.log;
    error_log /var/log/nginx/love-journal-error.log warn;

    # 客户端上传大小限制
    client_max_body_size 32m;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy
    # media-src 必须放行网易云音频 CDN（*.music.126.net / *.music.127.net），
    # 否则「一起听」的 <audio> 跨源直链会被浏览器拦截 —— 这正是「部分环境无法播放」
    # 的根因：本地 dev 无 CSP 能放，经 nginx 的生产环境被 CSP 拦死。生产仅允许
    # HTTPS scheme，避免 TLS 页面加载明文音频。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' https://*.music.126.net https://*.music.127.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    
    # 一起听 / 一起看 / 悄悄话 / 一起玩 WebSocket 实时同步（必须在 /api/ 之前；
    # /api/ 把 Connection 置空会破坏升级）。正则一并承载所有 WS 握手路径，优先级
    # 高于通用前缀 /api/，握手不会落到下面把 Connection 清空的块。一起玩走
    # games/<game>/ws（如 games/gomoku/ws、games/tictactoe/ws）。今后新增同步功能
    # 在此追加分支即可，避免再漏配。
    location ~ ^/api/v1/cottage/((listen|watch|chat|canvas|draw)|games/[a-z]+)/ws$ {
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # WebSocket 升级头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 常规代理头（token 走 httponly access_token cookie，由 nginx 默认转发）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：避免空闲被 60s 默认超时切断
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Backup restore is streamed by FastAPI and may legitimately reach 1 GiB.
    # Disable request buffering so nginx does not first duplicate it on disk.
    location ^~ /api/v1/export/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Multipart framing sits above the backend's exact 1 GiB file cap.
        # Leave explicit headroom for boundaries and future metadata fields.
        client_max_body_size 1050m;
        client_body_timeout 1h;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Local watch-party video uploads have a separate 2 GiB backend limit.
    location = /api/v1/cottage/watch/sources/upload {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Backend enforces the exact 2 GiB file limit; nginx must also allow
        # multipart boundaries and headers around that file.
        client_max_body_size 2100m;
        client_body_timeout 2h;
        proxy_connect_timeout 60s;
        proxy_send_timeout 2h;
        proxy_read_timeout 2h;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # API 后端代理
    location /api/ {
        # 重写路径，去掉 /api 前缀
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Regular media endpoints accept up to 100 MiB video plus multipart
        # overhead. Larger backup/watch uploads are isolated above.
        client_max_body_size 128m;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # 健康检查端点
    location = /health {
        proxy_pass http://backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # 就绪检查：数据库或 Redis 不可用时由后端返回 503，供部署脚本和
    # 容器编排判断服务是否真正可接收请求。
    location = /health/ready {
        proxy_pass http://backend_api/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }
    
    # API 文档（生产环境禁止公开访问，防止接口结构泄露）
    # 如需调试，可临时改为 IP 白名单：allow 192.168.1.0/24; deny all;
    location /docs {
        return 404;
    }
    
    # 上传文件服务（通过后端逐文件鉴权）
    location ^~ /uploads/ {
        proxy_pass http://backend_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # 安全：这些是按访问者权限逐文件鉴权的私密媒体。绝不能在共享代理层
        # 缓存——nginx 的缓存键不含 Cookie，缓存命中会把已鉴权的响应回放给
        # 未授权（甚至未登录）的用户，造成私密/加密媒体泄露。显式禁用缓存。
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "private, no-store" always;
    }

    # Service Worker 和 Web App Manifest 不能做长期强缓存；否则 PWA 更新会被卡住。
    location = /sw.js {
        proxy_pass http://frontend_web/sw.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /manifest.webmanifest {
        proxy_pass http://frontend_web/manifest.webmanifest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }
    
    # 前端静态文件
    location / {
        proxy_pass http://frontend_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # 缓存设置
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # 静态资源缓存优化
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        proxy_pass http://frontend_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
