user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    # Do not persist query strings: protected-content passwords and other
    # secrets must not land in access logs. Only the truthful TCP peer
    # ($remote_addr) is logged — $http_x_forwarded_for is client-forgeable and
    # would poison the log with arbitrary IPs.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/atom+xml image/svg+xml;
    gzip_disable "msie6";

    # 缓冲区设置
    client_body_buffer_size 128k;
    client_max_body_size 32m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # 超时设置
    client_header_timeout 3m;
    client_body_timeout 3m;
    send_timeout 3m;

    # 代理缓存配置
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g 
                     inactive=60m use_temp_path=off;

    # 限流/限连（匿名可达路径的带宽与连接保护；大上传通道见 conf.d 的独立限流）。
    limit_req_zone $binary_remote_addr zone=api_req:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=upload_req:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=media_req:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;
    limit_conn_zone $binary_remote_addr zone=media_conn:10m;
    limit_conn_log_level notice;

    # 包含站点配置
    include /etc/nginx/conf.d/*.conf;
}
