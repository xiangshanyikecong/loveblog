# Shared security response headers for love-journal.conf.
#
# nginx drops ALL inherited add_header directives as soon as any level
# (server/location) defines even one add_header of its own. Every location
# that adds e.g. a Cache-Control header MUST include this snippet again, or
# the response silently loses CSP/HSTS. The server block includes it too.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy
# - 'wasm-unsafe-eval': Vditor's Lute markdown engine is WebAssembly; modern
#   browsers refuse to instantiate WASM without it. (Plain 'unsafe-eval' is
#   deliberately NOT granted.)
# - cdn.jsdelivr.net: Vditor lazily loads Lute / highlight styles from the
#   jsDelivr CDN (see web RichTextEditor); scripts and styles must be allowed.
# - media-src must allow the NetEase audio CDN (*.music.126.net /
#   *.music.127.net), otherwise "listen together" <audio> cross-origin links
#   are blocked — production-only HTTPS scheme so a TLS page never loads
#   plaintext audio.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; media-src 'self' https://*.music.126.net https://*.music.127.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
